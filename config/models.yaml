version: 2
updated: "2026-07-10"
defaults:
  auto_mode_model_tokens:
    - auto
    - potato/auto
    - openrouter/auto
    - kilo/auto
    - kilo-auto/frontier
    - kilo-auto/balanced
    - kilo-auto/efficient
    - kilo-auto/free
    - ""
  passthrough_if_known: true
  max_fallback_attempts: 6
  classify_mode: dynamic
  # Resolve families against live NVIDIA docs + /v1/models (no hardcoded best ids)
  dynamic_families: true

# Soft family policy — concrete ids resolved at runtime
families:
  chat_primary: nemotron
  coding_primary: mimo
  fallbacks:
    - deepseek
    - kimi
    - grok
    - qwen
    - glm_5_2
    - step_3_7
    - minimax_m3

aliases:
  gpt-4o: chain:coding_agentic
  gpt-4o-mini: chain:chat_fast
  gpt-4.1: chain:coding_agentic
  gpt-4: chain:coding_agentic
  claude-3.5-sonnet: chain:coding_agentic
  claude-sonnet-4: chain:coding_agentic
  claude-opus-4: chain:coding_agentic
  o1: chain:reasoning
  o3: chain:reasoning
  o3-mini: chain:reasoning
  o4-mini: chain:reasoning
  cursor-small: chain:chat_fast
  default: chain:coding_agentic
  # OpenRouter / Kilo names are handled as auto-router virtual models
  # (see routing/auto_router.py) — not as chain aliases.

intents:
  coding_agentic:
    description: "Tools, multi-file, agent harnesses, repo coding"
    primary_family: mimo
    chain: []  # filled dynamically
  chat_fast:
    description: "Plain Q&A, summaries, short chat — latest Nemotron"
    primary_family: nemotron
    chain: []
  reasoning:
    description: "Math, logic, deep multi-step reasoning"
    primary_family: nemotron
    chain: []
  long_horizon:
    description: "Long agentic planning / large context engineering"
    primary_family: mimo
    chain: []
  vision:
    description: "Image + text VLM"
    primary_family: qwen
    chain: []
  embeddings:
    description: "Embedding models only"
    chain: []

models: {}

# Dynamic Intelligence Scoring — internet-primary model quality + affinity.
# ModelScoreCache loads this at startup; missing sections fall back to config.py defaults.
scoring:
  quality_signal_weights:
    aa_intelligence:  0.40
    hf_leaderboard:   0.30
    arena_elo:        0.20
    param_estimate:   0.10

  quality_bounds: {min: 10.0, max: 100.0}
  arena_elo_base: 800
  arena_elo_scale: 8.0

  intent_optimizer_weights:
    coding_agentic:  {intel: 0.50, speed: 0.32, avail: 0.15, prov: 0.03}
    reasoning:       {intel: 0.55, speed: 0.25, avail: 0.17, prov: 0.03}
    long_horizon:    {intel: 0.50, speed: 0.28, avail: 0.19, prov: 0.03}
    chat_fast:       {intel: 0.30, speed: 0.47, avail: 0.20, prov: 0.03}
    vision:          {intel: 0.45, speed: 0.35, avail: 0.17, prov: 0.03}
    embeddings:      {intel: 0.25, speed: 0.45, avail: 0.27, prov: 0.03}
    _default:        {intel: 0.45, speed: 0.35, avail: 0.17, prov: 0.03}

  intent_max_fallbacks:
    coding_agentic: 10
    reasoning:      10
    long_horizon:   8
    chat_fast:      6
    vision:         6
    embeddings:     4

  intent_attempt_budget_seconds:
    coding_agentic: 30.0
    reasoning:      45.0
    long_horizon:   45.0
    chat_fast:      15.0
    vision:         20.0
    embeddings:     10.0

  provider_speed_prior:
    groq: 1.35
    cerebras: 1.40
    sambanova: 1.30
    zen: 1.28
    deepseek: 1.25
    fireworks: 1.20
    together: 1.15
    deepinfra: 1.12
    hyperbolic: 1.12
    mistral: 1.10
    gemini: 1.08
    openrouter: 1.05
    nim: 1.05
    github: 1.00
    cloudflare: 1.00
    _default: 1.00

  capability_affinity_deltas:
    tools_confirmed_true:   {coding_agentic: 0.25, reasoning: 0.15}
    tools_confirmed_false:  {coding_agentic: -0.80}
    vision_confirmed_true:  {vision: 0.30}
    vision_confirmed_false: {vision: -0.95}
    reasoning_confirmed_true: {reasoning: 0.30, coding_agentic: 0.10}
    long_context:           {long_horizon: 0.25}
    short_context:          {long_horizon: -0.30}
    small_param:            {chat_fast: 0.20}
    frontier_param:         {coding_agentic: 0.20, reasoning: 0.30}
    embed_confirmed_true:   {embeddings: 0.30}
    embed_confirmed_false:  {embeddings: -0.95}

  quality_floor_keywords:
    ultra: 88.0
    super: 84.0
    pro: 82.0
    large: 80.0
    medium: 72.0
    small: 68.0
    mini: 65.0
    micro: 60.0
    "70b": 78.0
    "72b": 78.0
    "400b": 92.0
    "8b": 64.0
    "7b": 62.0
    instruct: 65.0
    _default: 60.0

  capability_hints:
    tools_true_patterns:    ["*gpt*","*claude*","*gemini*","*deepseek*","*qwen*","*mimo*"]
    vision_true_patterns:   ["*vision*","*vl*","*omni*","*gemini*","*gpt-4o*"]
    reasoning_true_patterns: ["*r1*","*o1*","*o3*","*o4*","*thinking*","*deepseek-r1*"]
    embed_true_patterns:    ["*embed*","*rerank*","*retrieval*"]
    exclude_chat_patterns:  ["*embed*","*rerank*","*ocr*","*asr*","*tts*","*diffusion*","*guard*","*safety*"]
