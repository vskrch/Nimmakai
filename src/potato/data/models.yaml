version: 2
updated: "2026-07-10"
defaults:
  auto_mode_model_tokens:
    - auto
    - potato/auto
    - ""
  passthrough_if_known: true
  max_fallback_attempts: 6
  classify_mode: dynamic
  # Resolve families against live NVIDIA docs + /v1/models (no hardcoded best ids)
  dynamic_families: true

# Soft family policy — concrete ids resolved at runtime
families:
  chat_primary: nemotron
  coding_primary: claude
  fallbacks:
    - deepseek
    - openai
    - qwen
    - gemini
    - llama
    - zhipu
    - moonshot

aliases:
  gpt-4o: chain:coding_agentic
  gpt-4o-mini: chain:chat_fast
  gpt-4.5: chain:coding_agentic
  gpt-4: chain:coding_agentic
  claude-3-7-sonnet: chain:coding_agentic
  claude-3.7-sonnet: chain:coding_agentic
  claude-3-5-sonnet: chain:coding_agentic
  claude-3.5-sonnet: chain:coding_agentic
  claude-3-5-haiku: chain:chat_fast
  claude-3-opus: chain:coding_agentic
  deepseek-r1: chain:reasoning
  deepseek-v3: chain:coding_agentic
  o1: chain:reasoning
  o3: chain:reasoning
  o3-mini: chain:reasoning
  cursor-small: chain:chat_fast
  default: chain:coding_agentic
  # Standard Anthropic API Model Slugs (Claude Code & API proxy compatibility)
  claude-3-7-sonnet-20250219: chain:coding_agentic
  claude-3-5-sonnet-20241022: chain:coding_agentic
  claude-3-5-sonnet-20240620: chain:coding_agentic
  claude-3-opus-20240229: chain:coding_agentic
  claude-3-5-haiku-20241022: chain:chat_fast

intents:
  coding_agentic:
    description: "Tools, multi-file, agent harnesses, repo coding"
    primary_family: mimo
    chain: []  # filled dynamically
  chat_fast:
    description: "Plain Q&A, summaries, short chat — latest Nemotron"
    primary_family: nemotron
    chain: []
  reasoning:
    description: "Math, logic, deep multi-step reasoning"
    primary_family: nemotron
    chain: []
  long_horizon:
    description: "Long agentic planning / large context engineering"
    primary_family: mimo
    chain: []
  vision:
    description: "Image + text VLM"
    primary_family: qwen
    chain: []
  embeddings:
    description: "Embedding models only"
    chain: []

models: {}

# Dynamic Intelligence Scoring — see config/models.yaml for full block.
# Duplicated here so installed wheels without the repo config still score models.
scoring:
  quality_signal_weights:
    aa_intelligence:  0.75
    hf_leaderboard:   0.15
    arena_elo:        0.10
    param_estimate:   0.00
  quality_bounds: {min: 10.0, max: 100.0}
  arena_elo_base: 800
  arena_elo_scale: 8.0
  intent_optimizer_weights:
    coding_agentic:  {intel: 0.90, speed: 0.06, avail: 0.03, prov: 0.01}
    reasoning:       {intel: 0.92, speed: 0.05, avail: 0.02, prov: 0.01}
    long_horizon:    {intel: 0.90, speed: 0.06, avail: 0.03, prov: 0.01}
    chat_fast:       {intel: 0.85, speed: 0.10, avail: 0.04, prov: 0.01}
    vision:          {intel: 0.88, speed: 0.08, avail: 0.03, prov: 0.01}
    embeddings:      {intel: 0.75, speed: 0.18, avail: 0.05, prov: 0.02}
    _default:        {intel: 0.88, speed: 0.08, avail: 0.03, prov: 0.01}
  intent_max_fallbacks:
    coding_agentic: 10
    reasoning: 10
    long_horizon: 8
    chat_fast: 6
    vision: 6
    embeddings: 4
  intent_attempt_budget_seconds:
    coding_agentic: 30.0
    reasoning: 45.0
    long_horizon: 45.0
    chat_fast: 15.0
    vision: 20.0
    embeddings: 10.0
  provider_speed_prior:
    groq: 1.35
    cerebras: 1.40
    sambanova: 1.30
    zen: 1.28
    deepseek: 1.25
    fireworks: 1.20
    together: 1.15
    deepinfra: 1.12
    hyperbolic: 1.12
    mistral: 1.10
    gemini: 1.08
    openrouter: 1.05
    nim: 1.05
    github: 1.00
    cloudflare: 1.00
    _default: 1.00
  capability_affinity_deltas:
    tools_confirmed_true:   {coding_agentic: 0.25, reasoning: 0.15}
    tools_confirmed_false:  {coding_agentic: -0.80}
    vision_confirmed_true:  {vision: 0.30}
    vision_confirmed_false: {vision: -0.95}
    reasoning_confirmed_true: {reasoning: 0.30, coding_agentic: 0.10}
    long_context:           {long_horizon: 0.25}
    short_context:          {long_horizon: -0.30}
    small_param:            {chat_fast: 0.20}
    frontier_param:         {coding_agentic: 0.20, reasoning: 0.30}
    embed_confirmed_true:   {embeddings: 0.30}
    embed_confirmed_false:  {embeddings: -0.95}
  model_family_priors:
    - patterns: ["claude-3-7", "claude-3.7", "o3-mini", "o3", "o1"]
      score: 98.0
    - patterns: ["claude-3-5-sonnet", "claude-3.5-sonnet", "gpt-4.5"]
      score: 97.0
    - patterns: ["deepseek-r1", "deepseek-v3"]
      score: 96.5
    - patterns: ["gpt-4o-mini", "claude-3-5-haiku"]
      score: 86.0
    - patterns: ["gpt-4o", "claude-3-opus"]
      score: 95.0
    - patterns: ["gemini-2.0-pro", "gemini-1.5-pro", "qwen3.5-397b"]
      score: 93.5
    - patterns: ["glm-5.2", "glm-5", "qwen2.5-coder-32b", "qwen2.5-coder", "qwen3.5-122b"]
      score: 92.5
    - patterns: ["qwen-2.5-72b", "qwen2.5-72b", "llama-3.3-70b", "kimi-k1.5", "kimi-k3", "nemotron-3-ultra"]
      score: 91.0
    - patterns: ["nemotron-3-super", "mistral-large"]
      score: 89.0
    - patterns: ["gemini-2.0-flash", "gemini-1.5-flash"]
      score: 86.0
    - patterns: ["glm-4-plus", "glm-4", "step-3.7", "step-3", "minimax-m3"]
      score: 85.0
  quality_floor_keywords:
    ultra: 88.0
    super: 84.0
    pro: 82.0
    large: 80.0
    medium: 72.0
    small: 68.0
    mini: 65.0
    micro: 60.0
    "70b": 78.0
    "72b": 78.0
    "400b": 92.0
    "8b": 64.0
    "7b": 62.0
    instruct: 65.0
    _default: 60.0
  capability_hints:
    tools_true_patterns:    ["*gpt*","*claude*","*gemini*","*deepseek*","*qwen*","*mimo*","*glm*","*step*","*nemotron*","*llama*","*mistral*"]
    vision_true_patterns:   ["*vision*","*vl*","*omni*","*gemini*","*gpt-4o*","*m3*"]
    reasoning_true_patterns: ["*r1*","*o1*","*o3*","*o4*","*thinking*","*deepseek-r1*","*qwq*","*kimi*","*glm-5*"]
    embed_true_patterns:    ["*embed*","*rerank*","*retrieval*"]
    exclude_chat_patterns:  ["*embed*","*rerank*","*ocr*","*asr*","*tts*","*diffusion*","*guard*","*safety*"]
